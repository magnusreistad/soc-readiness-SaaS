# CI for SOC Readiness: Next.js frontend (frontend/) + FastAPI backend (repo root).
#
#   lint  ->  test  ->  build
#
# Frontend and backend run as two independent DAG chains via `needs`, so a slow
# frontend build never blocks backend feedback (and vice versa). GitLab's
# SAST, Secret Detection and Dependency Scanning templates add their jobs to
# the `test` stage.
#
# The pipeline needs no secrets: tests never reach Supabase or OpenAI (see
# tests/conftest.py) and the frontend build uses placeholder public values.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # SBOM-based dependency scanning (new DS analyzer), Ultimate only. Scans
  # frontend/package-lock.json directly; a `.pre` resolution job pip-compiles
  # requirements.txt into a lockfile so transitive Python deps are covered.
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

stages:
  - lint
  - test   # also used by the included security templates
  - build
# (.pre is implicit; Dependency Scanning's resolution job runs there.)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # Run the security templates' jobs in MR pipelines. Without this they only
  # run in branch pipelines, which the workflow rules above don't create for
  # feature branches.
  AST_ENABLE_MR_PIPELINES: "true"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------

.frontend:
  image: node:20.20.2-slim
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  cache:
    key:
      prefix: frontend
      files: [frontend/package-lock.json]
    paths: [.cache/npm/]
    policy: pull
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund

frontend-lint:
  extends: .frontend
  stage: lint
  needs: []
  cache:
    policy: pull-push
  script:
    - npm run lint
    - npm run typecheck

frontend-test:
  extends: .frontend
  stage: test
  needs: [frontend-lint]
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    reports:
      junit: frontend/junit.xml

frontend-build:
  extends: .frontend
  stage: build
  needs: [frontend-test]
  variables:
    # Placeholders so `next build` can prerender. NEXT_PUBLIC_* values are
    # inlined into the bundle, so real ones belong to the deploy, not CI.
    NEXT_PUBLIC_SUPABASE_URL: "https://supabase.invalid"
    NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
  script:
    - npm run build

# ---------------------------------------------------------------------------
# Backend
# ---------------------------------------------------------------------------

.backend:
  image: python:3.11.15-slim
  cache:
    key:
      prefix: backend
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip/]

backend-lint:
  extends: .backend
  stage: lint
  needs: []
  script:
    - pip install -r requirements-dev.txt
    - ruff check .

backend-test:
  extends: .backend
  stage: test
  needs: [backend-lint]
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
